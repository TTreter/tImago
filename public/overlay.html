<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tImago — OBS Overlay</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo-icon.svg">
  <!-- Google Fonts para os Temas Natalino e Clean Moderno -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/overlay.css">
</head>
<body>
  <!-- Palco transparente 1920x1080 -->
  <div id="overlay-stage" class="stage pos-bottom-left theme-christmas">
    
    <!-- Card Principal do Anúncio / Frase -->
    <div id="overlay-card" class="overlay-card is-hidden" aria-live="polite">
      
      <!-- Ornamentos exclusivos dos Temas de Natal -->
      <div class="christmas-ornaments" aria-hidden="true">
        <div class="christmas-glow"></div>
        <div class="christmas-garland-top"></div>
        <div class="christmas-corner corner-tl">•</div>
        <div class="christmas-corner corner-tr">•</div>
        <div class="christmas-corner corner-bl">•</div>
        <div class="christmas-corner corner-br">•</div>
        <div class="christmas-star-badge">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 1L14.8 8.5L23 9.2L16.5 14.2L18.5 22L12 17.5L5.5 22L7.5 14.2L1 9.2L9.2 8.5L12 1Z" fill="url(#goldGrad)" stroke="#FFF3C4" stroke-width="1"/>
            <defs>
              <linearGradient id="goldGrad" x1="1" y1="1" x2="23" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FFE58F"/>
                <stop offset="0.5" stop-color="#D4AF37"/>
                <stop offset="1" stop-color="#9A7418"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>

      <!-- Medalhão / Ícone Dinâmico dos demais Temas (Páscoa, Mães, Pais, Futebol, Especial...) -->
      <div id="theme-badge-icon" class="theme-badge-icon" aria-hidden="true"></div>

      <!-- Detalhe lateral / superior de Temas Modernos & Esportivos -->
      <div class="clean-accent-bar" aria-hidden="true"></div>

      <!-- Conteúdo do Card (Logo Opcional + Texto) -->
      <div class="card-content-row">
        <div id="card-logo-box" class="card-logo-box is-hidden">
          <img id="card-logo-img" class="card-logo-img" src="" alt="Logo" />
        </div>

        <div class="card-inner">
          <!-- Selo de Participação do Público (Exibido apenas em frases de ouvintes/público) -->
          <div id="audience-kicker" class="audience-kicker is-hidden">
            <span class="audience-kicker-dot"></span>
            <span class="audience-kicker-text">MENSAGEM DO CIDADÃO</span>
          </div>

          <div class="card-text-wrapper">
            <p id="phrase-text" class="phrase-text"></p>
          </div>

          <div id="author-container" class="author-container is-empty">
            <span class="author-divider" aria-hidden="true"></span>
            <span id="phrase-author" class="phrase-author"></span>
          </div>
        </div>
      </div>

      <!-- Barra de Progresso do Tempo de Exibição -->
      <div id="progress-wrapper" class="progress-wrapper">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

    </div>

    <!-- Tarja de Identificação Rápida (Lower Third - Música / Preletor / Convidado - Fase 5) -->
    <div id="overlay-lower-third" class="overlay-lower-third is-hidden" aria-live="polite">
      <div class="lt-accent-bar"></div>
      <div class="lt-body">
        <span id="lt-badge" class="lt-badge">PRONUNCIAMENTO OFICIAL</span>
        <strong id="lt-title" class="lt-title"></strong>
        <span id="lt-subtitle" class="lt-subtitle"></span>
      </div>
    </div>

    <!-- Faixa Deslizante de Rodapé (Modo Ticker - Fase 5) -->
    <div id="overlay-ticker" class="overlay-ticker is-hidden" aria-live="off">
      <div class="ticker-label-box">
        <span class="ticker-live-dot"></span>
        <span id="ticker-label-text">AO VIVO</span>
      </div>
      <div class="ticker-track-viewport">
        <div id="ticker-track" class="ticker-track"></div>
      </div>
    </div>

    <!-- ====================================================================
         PLACAR ESPORTIVO AO VIVO (FUTEBOL, VÔLEI, BASQUETE, FUTSAL)
         Renderizado no topo da transmissão independente do overlay inferior
         ==================================================================== -->
    <div id="overlay-scoreboard" class="overlay-scoreboard is-hidden pos-top-left theme-pitch" aria-live="polite">
      <div class="sb-capsule">
        
        <!-- Bloco Time Mandante (A) -->
        <div class="sb-team sb-team-a">
          <div id="sb-color-a" class="sb-color-indicator"></div>
          <div id="sb-logo-box-a" class="sb-logo-box is-hidden">
            <img id="sb-logo-img-a" class="sb-logo-img" src="" alt="Time A" />
          </div>
          <span id="sb-name-a" class="sb-team-name">MAN</span>
          <div id="sb-cards-a" class="sb-cards-indicator is-hidden">
            <span id="sb-yellow-a" class="sb-card yellow is-hidden">0</span>
            <span id="sb-red-a" class="sb-card red is-hidden">0</span>
          </div>
        </div>

        <!-- Bloco Central de Placar / Pontuação -->
        <div class="sb-score-container">
          <span id="sb-score-a" class="sb-score-val">0</span>
          <span class="sb-score-x">:</span>
          <span id="sb-score-b" class="sb-score-val">0</span>
        </div>

        <!-- Bloco Time Visitante (B) -->
        <div class="sb-team sb-team-b">
          <div id="sb-cards-b" class="sb-cards-indicator is-hidden">
            <span id="sb-yellow-b" class="sb-card yellow is-hidden">0</span>
            <span id="sb-red-b" class="sb-card red is-hidden">0</span>
          </div>
          <span id="sb-name-b" class="sb-team-name">VIS</span>
          <div id="sb-logo-box-b" class="sb-logo-box is-hidden">
            <img id="sb-logo-img-b" class="sb-logo-img" src="" alt="Time B" />
          </div>
          <div id="sb-color-b" class="sb-color-indicator"></div>
        </div>

        <!-- Bloco de Tempo e Período (Futebol / Futsal / Basquete) -->
        <div id="sb-time-block" class="sb-time-block">
          <span id="sb-period-badge" class="sb-period-badge">1T</span>
          <span id="sb-timer-val" class="sb-timer-val">00:00</span>
          <span id="sb-extra-badge" class="sb-extra-badge is-hidden">+3'</span>
        </div>

        <!-- Bloco de Sets e Saque (Exclusivo Vôlei) -->
        <div id="sb-voley-block" class="sb-voley-block is-hidden">
          <div class="sb-sets-display">
            <span class="sb-sets-label">SETS</span>
            <span class="sb-sets-count"><b id="sb-sets-a">0</b> - <b id="sb-sets-b">0</b></span>
          </div>
          <div id="sb-serving-ball" class="sb-serving-indicator serving-a" title="Posse de Saque">
            <svg class="sb-ball-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
              <circle cx="12" cy="12" r="10" stroke="#FFFFFF" stroke-width="2" fill="none"/>
              <path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
            </svg>
          </div>
        </div>

      </div>

      <!-- Banner Expansivo de Celebração (GOL! / PONTO! / SET!) -->
      <div id="sb-celebration-banner" class="sb-celebration-banner is-hidden">
        <div class="sb-celebration-glow"></div>
        <div class="sb-celebration-content">
          <span id="sb-celebration-title" class="sb-celebration-title">GOL!</span>
          <span id="sb-celebration-subtext" class="sb-celebration-subtext">Mandante FC</span>
        </div>
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/overlay.js"></script>
</body>
</html>

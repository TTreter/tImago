<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>tImago — Inicializando</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-container {
      width: 480px;
      height: 290px;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #090d16 85%);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 34px 38px 28px;
      position: relative;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-container.fade-out {
      opacity: 0;
    }

    .glow-header {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 35px;
      background: #38bdf8;
      filter: blur(40px);
      opacity: 0.35;
      pointer-events: none;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }

    .logo-badge {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(99, 102, 241, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      animation: pulse-glow 2.5s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        border-color: rgba(56, 189, 248, 0.3);
      }
      50% {
        box-shadow: 0 0 28px rgba(56, 189, 248, 0.5);
        border-color: rgba(56, 189, 248, 0.7);
      }
    }

    .logo-badge svg {
      width: 36px;
      height: 36px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span.highlight {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-version {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-desc {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .progress-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 16px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
    }

    .status-text {
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: blink 1.2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .percentage-text {
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
      font-family: monospace;
      font-size: 12px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7 0%, #38bdf8 50%, #818cf8 100%);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
      transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>
  <div id="splash" class="splash-container">
    <div class="glow-header"></div>

    <div class="logo-area">
      <div class="logo-badge">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="#38BDF8" stroke-width="2.2" stroke-dasharray="2 3"/>
          <path d="M12 9V23L23 16L12 9Z" fill="#38BDF8"/>
        </svg>
      </div>

      <div class="brand-title">
        <span>t<span class="highlight">Imago</span></span>
        <span class="brand-version">v1.2.0</span>
      </div>

      <p class="brand-desc">Broadcast Overlay Controller • OBS Studio</p>
    </div>

    <div class="progress-section">
      <div class="progress-info">
        <div class="status-text">
          <span class="status-dot"></span>
          <span id="splash-status">Iniciando aplicação...</span>
        </div>
        <span id="splash-percent" class="percentage-text">0%</span>
      </div>

      <div class="progress-track">
        <div id="splash-progress" class="progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // Gerencia o progresso visual de forma fluida
    let targetPercent = 10;
    let currentPercent = 0;

    const statusEl = document.getElementById('splash-status');
    const percentEl = document.getElementById('splash-percent');
    const progressEl = document.getElementById('splash-progress');
    const splashEl = document.getElementById('splash');

    function updateView(percent, message) {
      if (typeof percent === 'number') {
        targetPercent = Math.min(100, Math.max(0, percent));
      }
      if (message) {
        statusEl.textContent = message;
      }
    }

    // Interpolação suave para animação a 60fps
    function tick() {
      if (currentPercent < targetPercent) {
        currentPercent += Math.max(0.5, (targetPercent - currentPercent) * 0.2);
        if (Math.abs(targetPercent - currentPercent) < 0.2) {
          currentPercent = targetPercent;
        }
        const rounded = Math.round(currentPercent);
        progressEl.style.width = currentPercent + '%';
        percentEl.textContent = rounded + '%';
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Expõe método global para o Electron invocar via executeJavaScript ou IPC
    window.setSplashProgress = (percent, message) => {
      updateView(percent, message);
    };

    window.fadeOutSplash = () => {
      updateView(100, 'Pronto! Abrindo Painel...');
      splashEl.classList.add('fade-out');
    };
  </script>
</body>
</html>
